# SIGNAL configuration. Values marked (paper) follow the EACL 2026 paper.

features:
  dim: 3840                # Audio-Mamba base; 512 for Whisper-base / x-vector, 768 for WavLM etc.

model:
  filters: [64, 128]       # f_cnn: two Conv1d layers + ReLU + max-pool (paper)
  embed_dim: 64            # d = 64 (paper)
  heads: 4
  k: 10                    # KNN neighbours
  knn_eps: 1.0e-6
  alpha: 0.5               # p_ens = alpha p_GNN + (1 - alpha) p_KNN
  tau: 0.5                 # open-set threshold (paper, Figure 3)
  dropout: 0.1

baseline:                  # CNN / FCN probes (paper, Table 1)
  filters: [64, 128]
  dense: [128]

training:
  lr: 1.0e-3               # Adam (paper)
  batch_size: 32           # (paper)
  epochs: 50               # up to 50, early stopping on dev (paper)
  patience: 10

synthetic:
  dim: 256
