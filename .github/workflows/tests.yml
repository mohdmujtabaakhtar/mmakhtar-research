name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn pyyaml pytest librosa
      - name: Unit tests
        run: pytest -q
      - name: End-to-end smoke tests
        run: |
          python -m papers.divine.train   --synthetic --epochs 3 --out results/divine.json
          python -m papers.nova_arc.train --synthetic --epochs 3 --out results/nova_arc.json
          python -m papers.orbit.train    --synthetic --epochs 3 --out results/orbit.json
          python -m papers.cobalt.train   --synthetic --epochs 3 --out results/cobalt.json
          python -m papers.hcfd.train     --synthetic --epochs 3 --out results/hcfd.json
