# SATYAM configuration. Values marked (paper) follow the ACL 2026 Findings paper.

features:
  whisper: {dim: 512}      # Whisper-base encoder, average-pooled (paper)
  trillsson: {dim: 1024}   # TRILLsson (paper)

num_classes: 2             # answers "Real" / "Fake"

model:
  conv_filters: 32         # lightweight CNN block: Conv1d (k=3) + max-pool (paper)
  shared_dim: 256          # d
  curvature: 1.0
  num_prefix: 4
  geometry: hyperbolic     # hyperbolic | euclidean (E-BD)
  fusion: satyam           # satyam | concat
  bd_ss: true              # Bhattacharyya alignment, speech-speech stage
  bd_st: true              # Bhattacharyya alignment, speech-prompt stage
  lambdas: [1.0, 0.5, 1.0] # lambda_1, lambda_2, lambda_3 (paper)
  dropout: 0.1

lm:
  backbone: Qwen/Qwen2-7B  # frozen decoder (paper); the lighter variant uses Qwen/Qwen-1_8B
  dtype: bfloat16
  lora_rank: 0             # decoder stays frozen (paper)

training:
  protocol: official       # ICF train / validation / test (paper)
  optimizer: adamw         # (paper)
  lr: 1.0e-4               # (paper)
  batch_size: 32           # (paper)
  epochs: 5                # (paper)
  patience: 5

synthetic:
  n_subjects: 60
  per_subject: 8
  dims: {whisper: 128, trillsson: 192}
  overrides:
    lm.backbone: toy       # tiny offline causal LM instead of Qwen2 ...
    lm.dtype: float32
    lm.lora_rank: 8        # ... which has no pretrained knowledge, so the smoke test adds LoRA adapters
    training.lr: 1.0e-3
    training.epochs: 20
