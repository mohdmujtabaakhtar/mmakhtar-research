# SNIFR configuration. Values marked (paper) follow the INTERSPEECH 2025 paper.

features:
  audio: {dim: 768}        # AST, average-pooled over time segments (paper)
  video: {dim: 768}        # VideoMAE, average-pooled over frames, 16 fps (paper)

num_classes: 4             # safe, sexual, violent, both (paper)

model:
  d_model: 256
  num_tokens: 12           # a pooled 768-d vector is read as 12 tokens of 64 features
  heads: 4
  ff: 512
  encoder_layers: 1
  cascades: 2              # two cross-transformer stages (paper)
  hidden: 120              # classifier dense layer (paper)
  dropout: 0.1
  fusion: snifr            # snifr | ct | ec | lc | ea | ep

training:
  protocol: kfold          # 5-fold CV (paper)
  optimizer: adamw         # (paper)
  lr: 1.0e-4               # (paper)
  weight_decay: 1.0e-5     # (paper)
  batch_size: 16           # (paper)
  epochs: 25               # (paper)
  patience: 5
  folds: 5
  seeds: [0]

synthetic:
  n_subjects: 40
  per_subject: 8
  dims: {audio: 192, video: 192}   # smaller features for the CPU smoke test
