# COFFE configuration. Values marked (paper) follow the INTERSPEECH 2025 paper.

features:
  # Paper's best pair: LanguageBind (768) + ImageBind (1024), average-pooled last hidden layer.
  fm1: {dim: 768}
  fm2: {dim: 1024}

num_classes: 8             # CtrSVDD systems A01-A08 (paper)

model:
  filters: [64, 128]       # two Conv1d blocks, kernel 3, max-pool 2 (paper)
  proj_dim: 128
  hidden: [128]            # FCN block with 128 neurons (paper)
  dropout: 0.3
  s: 0.3                   # Chernoff order (paper)
  lam: 0.1                 # lambda (paper)

baseline:                  # single-FM CNN / FCN (paper)
  filters: [64, 128]
  dense: [128]

training:
  protocol: official       # official train -> dev split (paper)
  lr: 1.0e-3               # Adam (paper)
  batch_size: 32
  epochs: 50               # (paper)
  patience: 10             # early stopping (paper)
  folds: 5
  seeds: [0]

synthetic:                 # generated data for --synthetic
  n_subjects: 40
  per_subject: 8
  dims: {fm1: 256, fm2: 384}   # smaller features for the CPU smoke test
