# MATA configuration. Values marked (paper) follow the ICASSP 2025 paper.

features:
  # Paper's best pair: LanguageBind (768) + ImageBind (1024), average-pooled last hidden layer.
  fm1: {dim: 768}
  fm2: {dim: 1024}

num_classes: 6             # JNV, VIVAE and CREMA-D have 6 classes; set to your ASVP-ESD label set

model:
  filters: [32, 64]        # two Conv1d blocks, kernel 3, max-pool (paper)
  proj_dim: 120            # linear projection to 120-d (paper)
  heads: 8                 # multi-head attention (paper)
  hidden: [128]
  dropout: 0.3
  ot_epsilon: 0.05
  ot_iters: 50
  use_mha: true            # false = "Fusion with OT" ablation (paper, Table I)
  fusion: mata             # mata | concat

baseline:                  # single-FM CNN (paper): Conv1d 64, 128 + dense 128
  filters: [64, 128]
  dense: [128]

training:
  protocol: kfold          # 5-fold CV (paper)
  lr: 1.0e-3               # Adam (paper)
  batch_size: 32           # (paper)
  epochs: 50               # (paper)
  patience: 10
  folds: 5
  seeds: [0]

synthetic:
  n_subjects: 40
  per_subject: 8
  dims: {fm1: 256, fm2: 384}   # smaller features for the CPU smoke test
