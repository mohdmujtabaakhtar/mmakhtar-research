# PARROT configuration. Values marked (paper) follow the INTERSPEECH 2025 paper.

features:
  # Paper's best pairs: Audio-Mamba base (3840) + HuBERT (768) on CREMA-D and Emo-DB,
  # Audio-Mamba base + MMS (1280) on MESD. Average-pooled last hidden layer.
  fm1: {dim: 3840}
  fm2: {dim: 768}

num_classes: 6             # CREMA-D: 6 emotions; set 7 for Emo-DB, 6 for MESD

model:
  filters: [64, 128]       # two Conv1d blocks, kernel 3, ReLU, max-pool (paper)
  proj_dim: 120            # linear projection to 120-d (paper)
  hidden: [128]            # dense layer of 128 units (paper)
  dropout: 0.3
  ot_epsilon: 0.05         # Sinkhorn entropy (cost normalised by its maximum)
  ot_iters: 50
  fusion: parrot           # parrot | hadamard | ot | concat

baseline:                  # single-PTM CNN / FCN (paper)
  filters: [64, 128]
  dense: [128]

training:
  protocol: kfold          # 5-fold CV (paper)
  lr: 1.0e-3               # Adam (paper)
  batch_size: 32           # (paper)
  epochs: 50               # (paper)
  patience: 10
  folds: 5
  seeds: [0]

synthetic:
  n_subjects: 40
  per_subject: 8
  dims: {fm1: 256, fm2: 384}   # smaller features for the CPU smoke test
