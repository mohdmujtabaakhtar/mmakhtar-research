# RENO configuration. Values marked (paper) follow the EUSIPCO 2025 paper.

features:
  # Paper's best pairs: Audio-Mamba base (3840) + UniSpeech-SAT (768) on ASVP-ESD,
  # Audio-Mamba tiny (960) + HuBERT (768) on JNV, Audio-Mamba base + HuBERT on VIVAE.
  fm1: {dim: 3840}
  fm2: {dim: 768}

num_classes: 6             # JNV and VIVAE: 6 emotions; set to your ASVP-ESD label set

model:
  filters: [32, 64]        # two Conv1d blocks, kernel 3, max-pool (paper)
  heads: 2                 # both self-attention blocks (paper)
  align_dim: 256
  hidden: [512, 128]       # FCN block (paper)
  dropout: 0.3
  beta: 2.0                # Renyi order (paper)
  delta: 0.2               # (paper)
  lam: 0.4                 # L = lam * CE + (1 - lam) * RD (paper)
  fusion: reno             # reno | concat

baseline:                  # single-FM CNN / FCN (paper)
  filters: [32, 64]
  dense: [512, 128]

training:
  protocol: kfold          # 5-fold CV (paper)
  lr: 1.0e-3               # Adam (paper)
  batch_size: 32           # (paper)
  epochs: 20               # (paper)
  patience: 10
  folds: 5
  seeds: [0]

synthetic:
  n_subjects: 40
  per_subject: 8
  dims: {fm1: 384, fm2: 256}   # smaller features for the CPU smoke test
